wing_definitions:
  - wing_id: finder
    wing_type: FINDER
    display_name: Finder Wing
    criticality: SUPPORTING
    required_capabilities:
      - information-retrieval
      - source-ranking
    allowed_outputs:
      - candidate-source-set
      - retrieval-trace
    prohibited_outputs:
      - final-execution-decision
    human_gate_required: false

  - wing_id: analyst
    wing_type: ANALYST
    display_name: Analyst Wing
    criticality: CRITICAL
    required_capabilities:
      - structured-reasoning
      - evidence-comparison
    allowed_outputs:
      - analysis-record
      - decision-recommendation
    prohibited_outputs:
      - unaudited-external-action
    human_gate_required: false

  - wing_id: executor
    wing_type: EXECUTOR
    display_name: Executor Wing
    criticality: CRITICAL
    required_capabilities:
      - tool-execution
      - action-receipt-generation
    allowed_outputs:
      - approved-tool-action
      - execution-receipt
    prohibited_outputs:
      - unapproved-external-action
    human_gate_required: true

  - wing_id: verifier
    wing_type: VERIFIER
    display_name: Verifier Wing
    criticality: CRITICAL
    required_capabilities:
      - output-validation
      - evidence-consistency-check
    allowed_outputs:
      - verification-result
      - blocking-finding
    prohibited_outputs:
      - primary-task-execution
    human_gate_required: false

  - wing_id: boundary
    wing_type: BOUNDARY
    display_name: Boundary Wing
    criticality: CRITICAL
    required_capabilities:
      - permission-evaluation
      - policy-boundary-check
    allowed_outputs:
      - permission-decision
      - escalation-request
    prohibited_outputs:
      - boundary-bypass
    human_gate_required: true

  - wing_id: trace-core
    wing_type: TRACE_CORE
    display_name: Trace Core Wing
    criticality: CRITICAL
    required_capabilities:
      - trace-persistence
      - checkpoint-generation
    allowed_outputs:
      - trace-checkpoint
      - trace-delta
    prohibited_outputs:
      - untracked-trace-deletion
    human_gate_required: false

